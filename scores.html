<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สรุปคะแนนนักเรียน · M3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=Sarabun:wght@400;600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--rose:#c8325a;--rose-d:#a3214a;--rose-l:#fde4ea;--ink:#3a2330;--muted:#6e5663;--line:#f3d3dc;--ok:#1f8a4c;--bad:#c0392b}
*{box-sizing:border-box}
body{margin:0;font-family:Sarabun,sans-serif;color:var(--ink);background:linear-gradient(160deg,#fff6f8 0%,#fdeef2 55%,#fff8f3 100%);min-height:100vh}
.wrap{max-width:1240px;margin:0 auto;padding:12px 22px 40px}
.banner{border-radius:24px;background:linear-gradient(120deg,#fff 0%,#fff1f5 45%,#fde2ea 100%);box-shadow:0 10px 28px rgba(200,50,90,.12);padding:20px 26px}
.banner h1{font:700 clamp(28px,4vw,44px)/1.1 Kanit,sans-serif;color:var(--rose);margin:0}
.banner p{margin:6px 0 0;color:var(--muted)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:16px 0 10px}
.bar label{font:500 15px Kanit,sans-serif}
select,input{font:500 16px Kanit,sans-serif;padding:7px 10px;border:2px solid var(--line);border-radius:12px;background:#fff}
.btn{border:0;border-radius:12px;padding:9px 16px;font:500 16px Kanit,sans-serif;background:linear-gradient(135deg,#e04a72,#c8325a);color:#fff;cursor:pointer;text-decoration:none;display:inline-block}
.btn.alt{background:var(--rose-l);color:var(--rose-d)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 12px}
.tabs button{border:2px solid var(--line);background:#fff;border-radius:20px;padding:5px 14px;font:500 15px Kanit,sans-serif;color:var(--ink);cursor:pointer}
.tabs button.on{background:var(--rose);border-color:var(--rose);color:#fff}
.card{background:#fff;border-radius:20px;box-shadow:0 10px 28px rgba(200,50,90,.10);padding:12px 14px;margin-bottom:16px}
.card h2{font:600 20px Kanit,sans-serif;margin:2px 0 8px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.card h2 small{font:400 14px Sarabun,sans-serif;color:var(--muted)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:var(--rose-l);font:500 14px Kanit,sans-serif;position:sticky;top:0}
td.c{text-align:center}th.c{text-align:center}
.ok{color:var(--ok);font-weight:700}.no{color:var(--bad);font-weight:700}.na{color:#bbb}
.pill{display:inline-block;border-radius:10px;padding:1px 8px;font:700 14px Nunito,sans-serif}
.pill.ok{background:#e7f7ec}.pill.no{background:#fff1f1}
.code{font:800 13px Nunito,monospace;background:var(--rose-l);border-radius:6px;padding:1px 6px}
.msg{padding:20px;text-align:center;color:var(--muted)}
.sum{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 12px}
.sum div{background:#fff;border-radius:14px;padding:8px 14px;box-shadow:0 6px 18px rgba(200,50,90,.08)}
.sum b{display:block;font:800 22px Nunito,sans-serif;color:var(--rose-d)}.sum span{font-size:13px;color:var(--muted)}
@media (max-width:600px){.wrap{padding:10px 10px 30px}th,td{padding:6px;font-size:13px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="banner"><h1>📊 สรุปคะแนนนักเรียน</h1><p>คะแนนรวมต่อหน่วย (เต็ม 100) = แบบทดสอบย่อย 80% + แบบฝึก 20% · ผ่าน 60 · แยกห้อง · เรียงเลขที่จากน้อยไปมาก</p></div>
  <div id="gate"></div>
  <div id="ctl" hidden>
    <div class="bar">
      <label>หน่วย <select id="unitSel"><option value="all">ภาพรวม 8 หน่วย</option></select></label>
      <label>คะแนนที่ใช้ <select id="scoreSel"><option value="best">สูงสุด</option><option value="first">ครั้งแรก</option></select></label>
      <span style="flex:1"></span>
      <button class="btn alt" id="reload">↻ โหลดใหม่</button>
      <button class="btn" id="csv">⬇️ CSV (ห้องที่เลือก)</button>
    </div>
    <div class="tabs" id="cls"></div>
  </div>
  <div id="out"></div>
</div>
<script src="config.js"></script>
<script>
(function(){
const $=s=>document.querySelector(s);
const CFG=window.M3_CONFIG||{};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SS={get(k){try{return sessionStorage.getItem(k)}catch(e){return null}},set(k,v){try{sessionStorage.setItem(k,v)}catch(e){}}};
const UNITS=[[1,'Stories'],[2,'Then and Now'],[3,'Goals'],[4,'Spend!'],[5,'A Better Place'],[6,'Experience'],[7,'My Stuff'],[8,'Responsibility']];
UNITS.forEach(([n,t])=>$('#unitSel').insertAdjacentHTML('beforeend',`<option value="${n}">Unit ${n} · ${t}</option>`));
let DATA=null,CLS='',VIEW=[];
const num=x=>{const m=String(x||'').match(/\d+/);return m?+m[0]:9999};
function gate(msg){
  $('#gate').innerHTML=`<div class="card" style="max-width:520px;margin-top:16px"><h2>🔒 ใส่รหัสครู</h2><form id="pf" style="display:flex;gap:8px"><input id="pin" type="password" inputmode="numeric" placeholder="รหัสครู" style="flex:1"><button class="btn">ดูคะแนน</button></form>${msg?`<p class="no">${esc(msg)}</p>`:''}</div>`;
  $('#pf').onsubmit=e=>{e.preventDefault();SS.set('m3:tp',$('#pin').value.trim());load()}}
async function fetchUnit(n,pin){const r=await fetch(`${CFG.supabaseUrl}/rest/v1/rpc/${CFG.teacherFn}`,{method:'POST',headers:{apikey:CFG.supabaseKey,Authorization:`Bearer ${CFG.supabaseKey}`,'Content-Type':'application/json'},body:JSON.stringify({p_pin:pin,p_unit:'unit'+n+'-test'})});
  if(r.status===400||r.status===401||r.status===403||r.status===404)throw new Error('pin');if(!r.ok)throw new Error('โหลดไม่ได้ ('+r.status+')');return r.json()}
async function load(){const pin=SS.get('m3:tp');if(!pin){gate();return}
  if(!CFG.supabaseUrl){$('#out').innerHTML='<div class="msg">ไม่พบการตั้งค่าฐานข้อมูล</div>';return}
  $('#gate').innerHTML='';$('#out').innerHTML='<div class="msg">กำลังโหลดคะแนน…</div>';
  try{const res=await Promise.all(UNITS.map(([n])=>fetchUnit(n,pin)));
    const st={};
    res.forEach((rows,ui)=>{const n=UNITS[ui][0];rows.slice().sort((a,b)=>String(a.created_at).localeCompare(String(b.created_at))).forEach(x=>{
      const k=(x.class||'').trim()+'|'+(x.student_no||'').trim()+'|'+(x.student_name||'').trim();
      const s=st[k]=st[k]||{cls:(x.class||'').trim(),no:(x.student_no||'').trim(),name:(x.student_name||'').trim(),u:{}};
      const d=x.detail||{},u=s.u[n]=s.u[n]||{n:0,first:null,best:null,passed:false,practice:null,code:'',last:''};
      u.n++;const tot=d.total!=null?{s:+d.total,m:100}:{s:Math.round(+x.score/(+x.max_score||1)*100),m:100};const sc=tot;if(d.quiz)u.quizRaw=d.quiz;if(!u.first)u.first=sc;if(!u.best||sc.s>u.best.s)u.best=sc;
      u.passed=u.passed||(d.passed!=null?!!d.passed:sc.s>=60);if(!u.practice&&d.practice)u.practice=d.practice;u.code=d.code||u.code;u.last=x.created_at})});
    DATA=Object.values(st);$('#ctl').hidden=false;
    const classes=[...new Set(DATA.map(s=>s.cls))].sort((a,b)=>a.localeCompare(b,'th',{numeric:true}));
    if(!CLS||!classes.includes(CLS))CLS=classes[0]||'';
    $('#cls').innerHTML=classes.map(c=>`<button data-c="${esc(c)}" class="${c===CLS?'on':''}">ห้อง ${esc(c)} (${DATA.filter(s=>s.cls===c).length})</button>`).join('');
    render()}
  catch(e){if(e.message==='pin'){SS.set('m3:tp','');gate('รหัสไม่ถูกต้อง')}else $('#out').innerHTML=`<div class="msg no">${esc(e.message)}</div>`}}
const pick=u=>u?($('#scoreSel').value==='first'?u.first:u.best):null;
function cell(u){if(!u)return '<td class="c na">–</td>';const s=pick(u);const ok=s.s>=60;return `<td class="c"><span class="pill ${ok?'ok':'no'}">${s.s}</span>${u.passed?' ✅':''}</td>`}
function render(){if(!DATA)return;const unitV=$('#unitSel').value;
  const list=DATA.filter(s=>s.cls===CLS).sort((a,b)=>num(a.no)-num(b.no)||a.name.localeCompare(b.name,'th'));
  if(!list.length){$('#out').innerHTML='<div class="msg">ยังไม่มีนักเรียนส่งคะแนน</div>';VIEW=[];return}
  if(unitV==='all'){
    VIEW=[['เลขที่','ชื่อ',...UNITS.map(([n])=>'U'+n),'ผ่าน (หน่วย)']].concat(list.map(s=>[s.no,s.name,...UNITS.map(([n])=>{const u=s.u[n];if(!u)return '';const x=pick(u);return x.s+(u.passed?' ผ่าน':'')}),UNITS.filter(([n])=>s.u[n]&&s.u[n].passed).length]));
    $('#out').innerHTML=`<div class="card"><h2>ห้อง ${esc(CLS)} · ภาพรวม 8 หน่วย <small>คะแนนรวมเต็ม 100 (${$('#scoreSel').value==='first'?'ครั้งแรก':'สูงสุด'}) · ✅ = ผ่าน 60</small></h2><div class="tw"><table>
      <tr><th>เลขที่</th><th>ชื่อ</th>${UNITS.map(([n])=>`<th class="c">U${n}</th>`).join('')}<th class="c">ผ่าน</th></tr>
      ${list.map(s=>`<tr><td>${esc(s.no)}</td><td>${esc(s.name)}</td>${UNITS.map(([n])=>cell(s.u[n])).join('')}<td class="c"><b>${UNITS.filter(([n])=>s.u[n]&&s.u[n].passed).length}</b>/8</td></tr>`).join('')}</table></div></div>`;
    return}
  const n=+unitV,rows=list.map(s=>({s,u:s.u[n]}));const done=rows.filter(r=>r.u),passN=done.filter(r=>r.u.passed).length;
  VIEW=[['เลขที่','ชื่อ','แบบฝึกคำศัพท์','แบบฝึกไวยากรณ์','แบบฝึกรวม','แบบทดสอบล่าสุด','คะแนนรวมครั้งแรก','คะแนนรวมสูงสุด','จำนวนครั้ง','ผล','รหัสตรวจสอบล่าสุด','ส่งล่าสุด']].concat(rows.map(({s,u})=>u?[s.no,s.name,u.practice?u.practice.vocab+'/'+u.practice.vocabMax:'',u.practice?u.practice.gram+'/'+u.practice.gramMax:'',u.practice?u.practice.s+'/'+u.practice.m:'',u.quizRaw?u.quizRaw.s+'/'+u.quizRaw.m:'',u.first.s,u.best.s,u.n,u.passed?'ผ่าน':'ไม่ผ่าน',u.code,new Date(u.last).toLocaleString('th-TH')]:[s.no,s.name,'','','','','','','ยังไม่ส่ง','','']));
  $('#out').innerHTML=`<div class="sum"><div><b>${done.length}/${rows.length}</b><span>ส่งแล้ว</span></div><div><b>${passN}</b><span>ผ่าน 60%</span></div><div><b>${done.length-passN}</b><span>ยังไม่ผ่าน</span></div></div>
   <div class="card"><h2>ห้อง ${esc(CLS)} · Unit ${n} ${esc(UNITS[n-1][1])} <small>แบบฝึกแสดงผลเท่านั้น ไม่นำไปคิดคะแนน</small></h2><div class="tw"><table>
   <tr><th>เลขที่</th><th>ชื่อ</th><th class="c">แบบฝึก<br>คำศัพท์</th><th class="c">แบบฝึก<br>ไวยากรณ์</th><th class="c">แบบทดสอบ<br>ล่าสุด</th><th class="c">รวม<br>ครั้งแรก</th><th class="c">รวม<br>สูงสุด</th><th class="c">ครั้ง</th><th class="c">ผล</th><th>รหัสตรวจสอบ</th><th>ส่งล่าสุด</th></tr>
   ${rows.map(({s,u})=>u?`<tr><td>${esc(s.no)}</td><td>${esc(s.name)}</td><td class="c">${u.practice?u.practice.vocab+'/'+u.practice.vocabMax:'–'}</td><td class="c">${u.practice?u.practice.gram+'/'+u.practice.gramMax:'–'}</td>
     <td class="c">${u.quizRaw?u.quizRaw.s+'/'+u.quizRaw.m:'–'}</td><td class="c">${u.first.s}</td><td class="c"><b>${u.best.s}</b></td><td class="c">${u.n}</td><td class="c ${u.passed?'ok':'no'}">${u.passed?'ผ่าน ✅':'ยังไม่ผ่าน'}</td><td>${u.code?`<span class="code">${esc(u.code.slice(0,3)+'-'+u.code.slice(3))}</span>`:''}</td><td>${esc(new Date(u.last).toLocaleString('th-TH',{dateStyle:'short',timeStyle:'short'}))}</td></tr>`
     :`<tr><td>${esc(s.no)}</td><td>${esc(s.name)}</td><td class="c na" colspan="9">ยังไม่ส่งหน่วยนี้</td></tr>`).join('')}</table></div></div>`}
$('#cls').onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;CLS=b.dataset.c;document.querySelectorAll('#cls button').forEach(x=>x.classList.toggle('on',x===b));render()};
$('#unitSel').onchange=render;$('#scoreSel').onchange=render;$('#reload').onclick=load;
$('#csv').onclick=()=>{if(!VIEW.length)return;const csv='﻿'+VIEW.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`scores-${CLS}-${$('#unitSel').value==='all'?'all':'unit'+$('#unitSel').value}.csv`;a.click()};
window.SCORES={setData(d){DATA=d;$('#ctl').hidden=false;const classes=[...new Set(d.map(s=>s.cls))].sort();CLS=classes[0];$('#cls').innerHTML=classes.map(c=>`<button data-c="${c}" class="${c===CLS?'on':''}">ห้อง ${c}</button>`).join('');render()}};
load();
})();
</script>
<script src="assets/shell.js" data-root="" data-active="scores"></script>
</body>
</html>

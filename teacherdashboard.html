<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher Dashboard | Unit 1</title><link rel="stylesheet" href="style.css"></head>
<body><header class="topbar"><b>👩‍🏫 Teacher Dashboard</b><button class="ghost" onclick="location.href='index.html'">หน้าแรก</button></header><main class="container">
<section id="lock" class="panel narrow"><span class="eyebrow">TEACHER LOGIN</span><h1>จัดการ Unit 1</h1><input id="tpin" class="biginput" type="password" placeholder="Teacher PIN: 9999"><button class="primary full" onclick="teacherLogin()">เข้าสู่ Dashboard</button></section>
<section id="dash" class="hidden"><div class="dash-head"><div><span class="eyebrow">UNIT CONTROL CENTER</span><h1>Unit 1: Present Time</h1><p class="muted">ครูสามารถเปิด/ปิดหน่วยและหัวข้อย่อยได้ทันที</p></div><button class="ghost" onclick="resetSettings()">คืนค่าเริ่มต้น</button></div>
<div id="unitControl"></div><div class="panel"><h2>🔐 การตั้งค่าการเข้าถึง</h2><div class="setting-row"><div><b>Unit 1</b><small>เปิดให้นักเรียนเข้าเรียนทั้งหน่วย</small></div><label class="switch"><input id="unitToggle" type="checkbox" onchange="toggleUnit(this.checked)"><span></span></label></div></div>
<div class="panel"><h2>📊 ผลการทดสอบ</h2><div id="results"></div></div></section></main><script src="js/data.js"></script><script src="js/teacher.js"></script></body></html>
